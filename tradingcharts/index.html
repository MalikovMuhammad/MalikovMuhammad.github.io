    <script type="text/javascript">
        function valyuta(pair) {
            const element = document.getElementById(pair);
            if (element.style.display == "none") {
                element.style.display = "flex";
                element.style.flexWrap = "wrap";
                element.style.gap = "10px";
                element.innerHTML = `
                    <div style="height: 400px; width:48%; min-width:450px;">
                        <div id="tradingview_${pair}_1"></div>
                    </div>

                    <div style="height: 400px; width:48%; min-width:450px;">
                        <div id="tradingview_${pair}_2"></div>
                    </div>
                `;
                // Первый график H1
                new TradingView.widget({
                    autosize: true,
                    symbol: "FX:" + pair,
                    interval: "60",
                    timezone: "Asia/Karachi",
                    theme: "light",
                    style: "1",
                    locale: "ru",
                    toolbar_bg: "#f1f3f6",
                    enable_publishing: false,
                    hide_legend: true,
                    allow_symbol_change: true,
                    save_image: false,
                    container_id: "tradingview_" + pair + "_1"
                });
                // Второй график M30
                new TradingView.widget({
                    autosize: true,
                    symbol: "FX:" + pair,
                    interval: "30",
                    timezone: "Asia/Karachi",
                    theme: "light",
                    style: "1",
                    locale: "ru",
                    toolbar_bg: "#f1f3f6",
                    enable_publishing: false,
                    hide_legend: true,
                    allow_symbol_change: true,
                    save_image: false,
                    container_id: "tradingview_" + pair + "_2"
                });
            } else {
                element.innerHTML = "";
                element.style.display = "none";
            }
        }

        function kripto(pair) {
            const element = document.getElementById(pair);
            if (element.style.display == "none") {

                    </div>

                    <div style="height: 400px; width:48%; min-width:450px;">
                        <div id="tradingview_${pair}_2"></div>
                    </div>
                `;
                new TradingView.widget({
                    autosize: true,
                    symbol: "BINANCE:" + pair,
                    interval: "60",
                    timezone: "Europe/Riga",
                    theme: "light",
                    style: "1",
                    locale: "ru",
                    toolbar_bg: "#f1f3f6",
                    enable_publishing: false,
                    hide_legend: true,
                    allow_symbol_change: true,
                    save_image: false,

                });
                new TradingView.widget({
                    autosize: true,

                    style: "1",

                    enable_publishing: false,
                    hide_legend: true,

                    save_image: false,
